<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Atlas has moved</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg: #eef1f3; --ink: #1b2229; --muted: #5f6b75; --accent: #e28a2b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e151b; --ink: #e8eef2; --muted: #98a6b1; --accent: #f0a44a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; color: var(--muted); }
  a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Travel Atlas has moved</h1>
  <p>It now lives at <a id="go" href="https://atlas.elijahpelton.com/">atlas.elijahpelton.com</a>. Taking you there, with the places you’ve marked on this device…</p>
  <p>If you installed the old version, delete its icon and install the app again from the new address.</p>
</main>
<script>
  // Forward to the new address. Marks saved under this old address travel in the URL fragment
  // (the part after #), which browsers never send to any server. Nothing is deleted here.
  (function () {
    var NEW = 'https://atlas.elijahpelton.com/';
    var parts = [];
    try {
      var marks = JSON.parse(localStorage.getItem('travel-atlas:v1') || '{}');
      var ids = Object.keys(marks).filter(function (k) { return marks[k]; }).sort();
      if (ids.length) parts.push('import=' + encodeURIComponent('atlas1:' + ids.join(',')));
      var owner = localStorage.getItem('travel-atlas:owner');
      if (owner) parts.push('owner=' + encodeURIComponent(owner));
      var accent = localStorage.getItem('travel-atlas:accent');
      if (accent) parts.push('accent=' + encodeURIComponent(accent));
      var style = localStorage.getItem('travel-atlas:style');
      if (style) parts.push('style=' + encodeURIComponent(style));
    } catch (e) {}
    var target = NEW + (parts.length ? '#' + parts.join('&') : '');
    document.getElementById('go').href = target;
    // Retire the old offline copy so this page (not the cached old app) loads from now on.
    try {
      // Only Travel Atlas's own worker and caches: other sites share this github.io origin.
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/travel-atlas\/$/.test(r.scope)) r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('atlas-') === 0) caches.delete(k); }); });
    } catch (e) {}
    setTimeout(function () { location.replace(target); }, 600);
  })();
</script>
</body>
</html>
